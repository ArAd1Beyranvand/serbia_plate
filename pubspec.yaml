name: serbia_plate
description: "Serbia's licence plates for the plate_core library — ten categories on a white, blue, orange-on-black, green or yellow field, one theme each, the Latin and Cyrillic area-code alphabets, and an advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/serbia_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/kosovo/icons/
    - assets/icons/
